<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Culinary Admin — rediseño</title>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
@font-face { font-family: 'Manrope'; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'JBM'; src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'JBM'; src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }

:root {
  --bg: #0b0a0d; --rail: #0e0c10; --panel: #141218; --panel-2: #1a171f; --raise: #221e28;
  --line: #2a2530; --line-2: #383140;
  --ink: #f3f0ea; --text: #d4cfc7; --muted: #948e98; --faint: #6b6570;
  --red: #e1263f; --red-2: #ff4a60; --red-ink: #ff7184; --red-deep: #8f1325;
  --violet: #8b5cf6; --teal: #22c3a0; --amber: #f2a93b; --gold: #e8c26a; --blue: #4f8df7;
  --green: #4fd18b; --sans: 'Manrope', system-ui, sans-serif; --mono: 'JBM', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body { color: var(--text); font: 500 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; width: 1600px; height: 1000px; overflow: hidden; }
.mono, code { white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.app { display: grid; grid-template-columns: 236px 1fr; height: 1000px; }

/* Rail */
.rail { position: relative; overflow: hidden; background: linear-gradient(180deg, #120e13 0%, #0d0b0f 60%, #0a090c 100%); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 26px 14px 18px; }
.rail::before { content: ''; position: absolute; right: -232px; top: 380px; width: 260px; height: 640px; border-radius: 50%; border-left: 2px solid rgba(225,38,63,.55); box-shadow: -30px 0 80px -20px rgba(225,38,63,.35) inset; }
.rail::after { content: ''; position: absolute; left: -60px; bottom: 120px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(225,38,63,.14), transparent 70%); }
.brand { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 30px; }
.brand img { width: 62px; height: 62px; filter: drop-shadow(0 6px 18px rgba(225,38,63,.45)); }
.brand b { font-size: 25px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; line-height: 1; }
.brand small { font-size: 17px; font-weight: 700; color: var(--text); margin-top: -2px; }
.nav { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 3px; }
.nav a { display: flex; align-items: center; gap: 13px; padding: 11px 14px; border-radius: 10px; color: var(--text); font-weight: 600; font-size: 14.5px; text-decoration: none; }
.nav a svg { width: 20px; height: 20px; color: var(--muted); stroke-width: 1.8; }
.nav a.on { background: linear-gradient(135deg, #e8314a, #b3172d); color: #fff; box-shadow: 0 8px 24px -8px rgba(225,38,63,.7), inset 0 1px 0 rgba(255,255,255,.18); }
.nav a.on svg { color: #fff; }
.nav .badge { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; background: rgba(225,38,63,.16); color: var(--red-ink); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
.nav a.on .badge { background: rgba(255,255,255,.22); color: #fff; }
.nav .sep { height: 1px; background: var(--line); margin: 10px 8px; }
.rail-foot { position: relative; z-index: 1; margin-top: auto; display: flex; flex-direction: column; gap: 16px; padding: 0 6px; }
.me { display: flex; align-items: center; gap: 11px; }
.avatar { position: relative; width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #3a3340, #1e1a22); display: grid; place-items: center; color: var(--ink); font-weight: 800; border: 1px solid var(--line-2); }
.avatar::after { content: ''; position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2px solid var(--rail); }
.me b { display: block; color: var(--ink); font-size: 14.5px; } .me small { color: var(--muted); font-size: 12px; }
.out { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 13.5px; } .out svg { width: 19px; color: var(--red-2); }

/* Main */
.main { position: relative; padding: 22px 30px 26px; display: flex; flex-direction: column; gap: 18px; min-width: 0; overflow: hidden; }
.top { display: flex; align-items: center; gap: 18px; justify-content: flex-end; }
.search { width: 380px; height: 44px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--muted); }
.search svg { width: 19px; } .search kbd { margin-left: auto; font: 500 11px var(--mono); color: var(--faint); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 6px; }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--text); }
.icon-btn svg { width: 22px; } .icon-btn i.dot { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; border-radius: 99px; background: var(--red); color: #fff; font: 700 10.5px var(--sans); font-style: normal; display: grid; place-items: center; border: 2px solid var(--bg); }

.masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.mast-r { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.head { display: flex; align-items: stretch; gap: 20px; padding-top: 18px; }
.head .bar { width: 5px; align-self: stretch; border-radius: 3px; background: linear-gradient(180deg, var(--red-2), var(--red-deep)); box-shadow: 0 0 18px rgba(225,38,63,.55); }
.head h1 { font-size: 30px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; line-height: 1.15; }
.head p { color: var(--text); font-size: 15.5px; margin-top: 4px; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.activity { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-radius: 14px; background: linear-gradient(135deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); min-width: 300px; }
.activity svg { width: 24px; color: var(--text); } .activity small { display: block; color: var(--muted); font-size: 12.5px; } .activity b { color: var(--ink); font-size: 13.5px; font-weight: 600; }

/* Cards */
.card { background: linear-gradient(180deg, #17141b, #121015); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -24px rgba(0,0,0,.8); }
.card-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px 14px; }
.card-head .ico { width: 38px; height: 38px; }
.card-head h2 { font-size: 19px; font-weight: 800; color: var(--ink); letter-spacing: -.01em; }
.card-head p { color: var(--muted); font-size: 13px; }
.card-head .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.card-body { padding: 0 20px 18px; }
.more { display: inline-flex; align-items: center; gap: 6px; color: var(--red-ink); font-weight: 600; font-size: 13.5px; padding: 10px 20px 16px; } .more svg { width: 15px; }

.ico { flex: none; display: grid; place-items: center; color: #fff; }
.ico svg { width: 60%; height: 60%; }
.ico.flat svg { stroke-width: 2; } .ico.flat.red { color: var(--red-2); } .ico.flat.violet { color: #a78bfa; } .ico.flat.teal { color: var(--teal); } .ico.flat.amber { color: var(--amber); } .ico.flat.gold { color: var(--gold); } .ico.flat.blue { color: #7aa8ff; }

.tile3d { width: 66px; height: 66px; border-radius: 16px; position: relative; box-shadow: 0 14px 28px -10px var(--glow), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -6px 12px rgba(0,0,0,.25); }
.tile3d::after { content: ''; position: absolute; inset: 3px 3px 50% 3px; border-radius: 13px 13px 30px 30px; background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0)); }
.tile3d svg { width: 34px; height: 34px; stroke-width: 2.2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); position: relative; z-index: 1; }
.g-red { background: linear-gradient(145deg, #ff5a6e, #c8152f 70%); --glow: rgba(225,38,63,.6); }
.g-violet { background: linear-gradient(145deg, #a37bff, #5b2fd6 70%); --glow: rgba(139,92,246,.6); }
.g-teal { background: linear-gradient(145deg, #3fe0b8, #0e8c70 70%); --glow: rgba(34,195,160,.55); }
.g-amber { background: linear-gradient(145deg, #ffc35a, #d07a0c 70%); --glow: rgba(242,169,59,.55); }
.g-gold { background: linear-gradient(145deg, #ffe08a, #b88514 70%); --glow: rgba(232,194,106,.5); }
.g-blue { background: linear-gradient(145deg, #77a8ff, #2a5fd0 70%); --glow: rgba(79,141,247,.55); }
.g-steel { background: linear-gradient(145deg, #8e8a9a, #45404f 70%); --glow: rgba(140,130,160,.4); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.kpi { position: relative; overflow: hidden; padding: 18px 18px; display: flex; align-items: center; gap: 18px; height: 112px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(135deg, var(--tint) 0%, #141218 55%); }
.kpi .v { font-size: 32px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 17px; font-weight: 700; color: var(--text); margin-left: 2px; }
.kpi .l { color: var(--text); font-size: 14px; margin-top: 8px; }
.kpi .chip { position: absolute; top: 16px; right: 16px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.chip.up { background: rgba(79,209,139,.14); color: var(--green); } .chip.down { background: rgba(225,38,63,.16); color: var(--red-ink); } .chip.neutral { background: rgba(255,255,255,.07); color: var(--text); }
.chip svg { width: 13px; height: 13px; stroke-width: 2.6; }
.kpi .go { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--goc); color: #fff; } .kpi .go svg { width: 15px; stroke-width: 2.6; }
.kpi svg.spark { position: absolute; right: 0; bottom: 0; width: 34%; height: 50px; opacity: .85; }
.kpi > div:nth-child(2) { position: relative; z-index: 1; }
.t-red { --tint: rgba(225,38,63,.22); --goc: #c8152f; } .t-violet { --tint: rgba(139,92,246,.22); --goc: #6d3fe6; } .t-teal { --tint: rgba(34,195,160,.2); --goc: #109a7b; } .t-amber { --tint: rgba(242,169,59,.2); --goc: #c97a12; } .t-gold { --tint: rgba(232,194,106,.18); --goc: #a77a10; } .t-blue { --tint: rgba(79,141,247,.2); --goc: #2a5fd0; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--raise); color: var(--ink); font: 650 13.5px var(--sans); white-space: nowrap; }
.btn svg { width: 17px; height: 17px; stroke-width: 2.2; }
.btn.primary { border: 0; background: linear-gradient(135deg, #f0384f, #c1172f); color: #fff; box-shadow: 0 10px 24px -10px rgba(225,38,63,.8), inset 0 1px 0 rgba(255,255,255,.2); }
.btn.ghost { background: transparent; } .btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 9px; } .btn.sm svg { width: 15px; height: 15px; }
.btn.danger { color: var(--red-ink); border-color: rgba(225,38,63,.35); background: rgba(225,38,63,.08); }
.btn.dots { width: 32px; padding: 0; justify-content: center; }
.btn.tint-red { background: linear-gradient(135deg, rgba(225,38,63,.32), rgba(225,38,63,.14)); border-color: rgba(225,38,63,.4); }
.btn.tint-gold { background: linear-gradient(135deg, rgba(232,194,106,.24), rgba(232,194,106,.08)); border-color: rgba(232,194,106,.35); }
.btn.tint-violet { background: linear-gradient(135deg, rgba(139,92,246,.3), rgba(139,92,246,.1)); border-color: rgba(139,92,246,.4); }

/* Tables */
table { width: 100%; border-collapse: separate; border-spacing: 0; }
thead th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 11px 14px; background: rgba(255,255,255,.025); border-bottom: 1px solid var(--line); }
thead th:first-child { border-radius: 10px 0 0 0; } thead th:last-child { border-radius: 0 10px 0 0; }
tbody td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.045); color: var(--text); vertical-align: middle; font-size: 13.5px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.sel td { background: rgba(225,38,63,.07); } tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--red); }
td .main-t { color: var(--ink); font-weight: 650; white-space: nowrap; } td .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
td.r, th.r { text-align: right; } td.num { white-space: nowrap; font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.tbl-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 650; white-space: nowrap; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: rgba(79,209,139,.13); color: var(--green); }
.pill.warn { background: rgba(242,169,59,.14); color: var(--amber); }
.pill.bad { background: rgba(225,38,63,.15); color: var(--red-ink); }
.pill.idle { background: rgba(255,255,255,.07); color: var(--muted); }
.pill.info { background: rgba(79,141,247,.14); color: #8fb5ff; }
.pill.vio { background: rgba(139,92,246,.16); color: #b9a0ff; }
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; border: 1px solid var(--line-2); color: var(--text); background: rgba(255,255,255,.03); }
.tag.pro { color: var(--gold); border-color: rgba(232,194,106,.35); background: rgba(232,194,106,.08); }
.tag.lite { color: #9ec3ff; border-color: rgba(79,141,247,.35); background: rgba(79,141,247,.08); }

.seg { display: inline-flex; padding: 4px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; }
.seg span { white-space: nowrap; padding: 6px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; }
.seg span.on { background: var(--raise); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.seg span b { font-size: 11px; color: var(--faint); } .seg span.on b { color: var(--red-ink); }
.field-s { height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--muted); font-size: 13.5px; }
.field-s svg { width: 17px; }

.grid { display: grid; gap: 18px; min-height: 0; }
.row { display: flex; align-items: center; gap: 12px; }
.muted { color: var(--muted); } .ink { color: var(--ink); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 9px 14px; font-size: 13px; } .kv dt { color: var(--muted); } .kv dd { color: var(--ink); }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.h3 { font-size: 14px; font-weight: 750; color: var(--ink); }
.snip { font: 12px/1.6 var(--mono); color: #cfc9d4; background: #0c0b0e; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; white-space: pre; overflow: hidden; }

/* Module cards (Resumen) */
.mods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.mod { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.mod .t { display: flex; gap: 10px; } .mod .t .ico { width: 30px; height: 30px; }
.mod b { color: var(--ink); font-size: 16px; display: block; } .mod small { color: var(--muted); font-size: 12px; }
.mod .art { display: flex; justify-content: center; } .mod .art .tile3d { width: 74px; height: 74px; border-radius: 20px; }
.mod .art .tile3d svg { width: 38px; height: 38px; }
.mod .btn { justify-content: center; }

/* Charts */
.chart { width: 100%; display: block; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Drawer */
.drawer { padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.keyplate { position: relative; border-radius: 14px; padding: 16px; background: linear-gradient(145deg, #241e28, #17131a); border: 1px solid var(--line-2); }
.keyplate::before { content: ''; position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 12px rgba(225,38,63,.7); }

/* Support */
.ticket { padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,.045); display: flex; flex-direction: column; gap: 5px; }
.ticket.on { background: rgba(225,38,63,.07); box-shadow: inset 3px 0 0 var(--red); }
.ticket .row1 { display: flex; align-items: center; gap: 8px; } .ticket b { color: var(--ink); font-size: 13.5px; } .ticket time { margin-left: auto; color: var(--faint); font: 11.5px var(--mono); }
.ticket p { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg { max-width: 72%; padding: 12px 15px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
.msg.them { background: var(--raise); border: 1px solid var(--line-2); border-top-left-radius: 4px; color: var(--text); }
.msg.us { margin-left: auto; background: linear-gradient(135deg, rgba(225,38,63,.28), rgba(225,38,63,.14)); border: 1px solid rgba(225,38,63,.35); border-top-right-radius: 4px; color: var(--ink); }
.msg-meta { font-size: 11.5px; color: var(--faint); margin: 4px 2px 0; } .msg-meta.r { text-align: right; }

.price-in { display: flex; align-items: center; height: 38px; border-radius: 9px; background: #0e0c11; border: 1px solid var(--line-2); padding: 0 11px; gap: 6px; font: 500 13.5px var(--mono); color: var(--ink); }
.price-in span { color: var(--faint); } .price-in em { margin-left: auto; font: 600 11px var(--sans); color: var(--faint); font-style: normal; }
.price-in.focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(225,38,63,.2); }
.ptable { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 10px 12px; align-items: center; }
.ptable .h { font-size: 12px; color: var(--muted); font-weight: 600; }
.bar-h { height: 8px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; } .bar-h i { display: block; height: 100%; border-radius: 99px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 14px; padding: 18px; display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,.015); }
.prog { height: 6px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; } .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--red-2)); border-radius: 99px; }
.stat-mini { padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.025); border: 1px solid var(--line); }
.stat-mini small { color: var(--muted); font-size: 12px; display: block; } .stat-mini b { color: var(--ink); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.watermark { position: absolute; right: -24px; bottom: -30px; width: 150px; height: 150px; color: rgba(255,255,255,.035); } .watermark svg { width: 100%; height: 100%; stroke-width: 1.2; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><img src="../../src-tauri/icons/icon.png" alt=""><b>Culinary</b><small>Admin</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="me"><div class="avatar">PD</div><div><b>PizzaDev</b><small>Administrador</small></div></div>
      <div class="out"><i data-lucide="log-out"></i>Cerrar sesión</div>
    </div>
  </aside>
  <main class="main">
    <div id="page" style="display:contents"></div>
  </main>
</div>

<script>
const P = new URLSearchParams(location.search).get('p') || 'resumen';
const NAV = [
  ['resumen', 'Resumen', 'layout-dashboard'],
  ['licencias', 'Licencias', 'key-round', 4],
  ['ganancias', 'Ganancias', 'trending-up'],
  ['versiones', 'Versiones', 'layers'],
  ['soporte', 'Soporte', 'headset', 6],
  ['fallos', 'Fallos', 'triangle-alert', 2],
  ['sucursales', 'Sucursales', 'store'],
  ['dueno', 'Panel del dueño', 'crown'],
  ['equipo', 'Equipo y seguridad', 'shield-check'],
];

function spark(color, pts) {
  const w = 220, h = 62, max = Math.max(...pts), min = Math.min(...pts);
  const xy = pts.map((p, i) => [i * w / (pts.length - 1), h - 6 - (p - min) / (max - min || 1) * (h - 18)]);
  const d = xy.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function revChart() {
  const W = 760, H = 250, L = 46, B = 28, T = 10, max = 80, bw = 34;
  const step = (W - L - 10) / 12; const y = v => T + (H - T - B) * (1 - v / max);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for (let v = 0; v <= max; v += 20) s += `<line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2530" ${v ? 'stroke-dasharray="3 5"' : ''}/><text x="${L - 10}" y="${y(v) + 4}" fill="#6b6570" font-size="11" text-anchor="end" font-family="JBM">${v ? '$' + v + 'k' : '0'}</text>`;
  const cols = ['#5b8def', '#e8c26a', '#22c3a0', '#a37bff'];
  REV.forEach((r, i) => {
    const x = L + step * i + (step - bw) / 2; let acc = 0;
    r.forEach((v, j) => { if (!v) return; const y0 = y(acc), y1 = y(acc + v); acc += v; const top = j === r.length - 1 || r.slice(j + 1).every(z => !z);
      s += `<rect x="${x}" y="${y1 + 1}" width="${bw}" height="${Math.max(0, y0 - y1 - 1.5)}" rx="${top ? 5 : 1.5}" fill="${cols[j]}" ${i === 11 ? '' : 'opacity=".82"'}/>`; });
    s += `<text x="${x + bw / 2}" y="${H - 8}" fill="${i === 11 ? '#f3f0ea' : '#948e98'}" font-size="11.5" font-weight="${i === 11 ? 700 : 500}" text-anchor="middle" font-family="Manrope">${MONTHS[i]}</text>`;
    if (i === 11) s += `<text x="${x + bw / 2}" y="${y(acc) - 8}" fill="#f3f0ea" font-size="12" font-weight="700" text-anchor="middle" font-family="JBM">$50.0k</text>`;
  });
  return s + '</svg>';
}

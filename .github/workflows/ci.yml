name: Pruebas

on:
  push:
    branches: [master]
  pull_request:

jobs:
  panel:
    # The suite drives Microsoft Edge, preinstalled on the Windows runners.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test
